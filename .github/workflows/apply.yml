name: "Terraform Apply - GCP Landing Zone"

on:
  push:
    branches:
      - main
    paths:
      - "gcp-landing-zone/**"

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: "Ordered Landing Zone Deployment"
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: gcp-landing-zone

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Authenticate to Google Cloud via WIF"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/123456789012/locations/global/workloadIdentityPools/pool-github-actions/providers/provider-github"
          service_account: "sa-tf-foundation@prj-seed-bootstrap-0123.iam.gserviceaccount.com"

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Deploy Ordered Foundation Stages"
        run: |
          stages=(
            "bootstrap"
            "foundation/00-organization"
            "foundation/01-folders"
            "foundation/02-org-policies"
            "foundation/03-custom-constraints"
            "foundation/04-iam"
            "foundation/05-logging"
            "foundation/06-networking"
            "foundation/07-ai-governance"
            "environments/dev"
            "environments/stg"
            "environments/prod"
          )

          for stage in "${stages[@]}"; do
            echo "::group::Deploying Stage: $stage"
            (cd "$stage" && terraform init && terraform apply -auto-approve)
            echo "::endgroup::"
          done
